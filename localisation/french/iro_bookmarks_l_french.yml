l_french:
 iro_bookmark_1919:0 "Janvier 1919"
 iro_bookmark_1919_desc:0 "1er janvier 1919. Les canons se sont tus depuis l'armistice du 11 novembre, mais la paix n'est pas signée : les délégations alliées arrivent à Paris pour une conférence qui s'ouvrira le 18 janvier. À Berlin, le Conseil des commissaires du peuple de Friedrich Ebert gouverne la république proclamée le 9 novembre. En Russie, Rouges et Blancs se disputent les restes de l'empire, tandis que Polonais et Ukrainiens se battent pour Lwów."
 iro_bookmark_1919_autres:0 "De la Baltique aux Balkans, les frontières de 1914 ne valent plus rien et celles de la paix ne sont pas encore tracées. Chaque gouvernement doit tenir ce qu'il occupe avant que la conférence de Paris ne tranche."
 iro_bookmark_1919_FRA:0 "Poincaré à l'Élysée, Clemenceau à la présidence du Conseil depuis novembre 1917 : la France sort victorieuse mais saignée, avec près de 1 400 000 morts et dix départements du Nord et de l'Est dévastés. Les troupes françaises sont entrées à Strasbourg le 22 novembre et l'Alsace-Lorraine est reprise. Paris accueille la conférence de la paix, où Clemenceau veut des garanties contre l'Allemagne."
 iro_bookmark_1919_ENG:0 "Les élections du 14 décembre 1918, les premières où votent les femmes de plus de 30 ans, ont donné une large majorité à la coalition de David Lloyd George. La Royal Navy tient toujours le blocus de l'Allemagne. En Irlande, le Sinn Féin a gagné 73 sièges et refuse de siéger à Westminster."
 iro_bookmark_1919_USA:0 "Woodrow Wilson a débarqué à Brest le 13 décembre 1918, premier président en exercice à se rendre en Europe, pour défendre ses Quatorze points et sa Société des nations. Mais les élections de novembre ont donné aux républicains le contrôle des deux chambres du Congrès, et c'est le Sénat qui devra ratifier le traité."
 iro_bookmark_1919_ITA:0 "Victorieuse à Vittorio Veneto, l'Italie a imposé l'armistice de Villa Giusti à l'Autriche-Hongrie le 3 novembre 1918. Le gouvernement de Vittorio Emanuele Orlando exige ce que promettait le pacte de Londres de 1915, le Trentin, l'Istrie et une partie de la Dalmatie, et réclame en plus Fiume."
 iro_bookmark_1919_JAP:0 "Hara Takashi, premier chef de gouvernement sans titre de noblesse, dirige le cabinet depuis septembre 1918, après les émeutes du riz de l'été. Des troupes japonaises occupent la Sibérie orientale depuis août. À Paris, le Japon veut garder les droits allemands du Shandong pris en 1914."
 iro_bookmark_1919_GER:0 "Depuis l'abdication de Guillaume II, Friedrich Ebert gouverne à la tête du Conseil des commissaires du peuple, que les indépendants de l'USPD ont quitté le 29 décembre. Le Parti communiste d'Allemagne tient son congrès fondateur à Berlin, et l'Assemblée nationale doit être élue le 19 janvier. Le blocus allié continue."
 iro_bookmark_1919_SOV:0 "Le Conseil des commissaires du peuple de Lénine gouverne depuis Moscou et a annulé le traité de Brest-Litovsk le 13 novembre 1918. L'Armée rouge de Trotski fait face à l'amiral Koltchak, proclamé Régent suprême à Omsk le 18 novembre, et à Dénikine dans le Sud, tandis que des troupes alliées tiennent Arkhangelsk et Mourmansk."
