l_english:
 iro_bookmark_1919:0 "January 1919"
 iro_bookmark_1919_desc:0 "1 January 1919. The guns have been silent since the armistice of 11 November, but no peace has been signed: the Allied delegations are arriving in Paris for a conference that will open on 18 January. In Berlin, Friedrich Ebert's Council of the People's Deputies governs the republic proclaimed on 9 November. In Russia, Reds and Whites fight over what is left of the empire, while Poles and Ukrainians battle for Lwów."
 iro_bookmark_1919_autres:0 "From the Baltic to the Balkans, the borders of 1914 are worth nothing and those of the peace have yet to be drawn. Every government must hold what it occupies before the Paris conference decides."
 iro_bookmark_1919_FRA:0 "Poincaré at the Élysée, Clemenceau Prime Minister since November 1917: France has won but bled white, with nearly 1,400,000 dead and ten departments of the North and East devastated. French troops entered Strasbourg on 22 November and Alsace-Lorraine is French again. Paris hosts the peace conference, where Clemenceau wants guarantees against Germany."
 iro_bookmark_1919_ENG:0 "The election of 14 December 1918, the first in which women over 30 could vote, gave David Lloyd George's coalition a large majority. The Royal Navy still enforces the blockade of Germany. In Ireland, Sinn Féin won 73 seats and refuses to sit at Westminster."
 iro_bookmark_1919_USA:0 "Woodrow Wilson landed at Brest on 13 December 1918, the first sitting president to travel to Europe, to defend his Fourteen Points and his League of Nations. But the November elections gave the Republicans control of both houses of Congress, and the Senate must ratify the treaty."
 iro_bookmark_1919_ITA:0 "Victorious at Vittorio Veneto, Italy forced the armistice of Villa Giusti on Austria-Hungary on 3 November 1918. Vittorio Emanuele Orlando's government demands what the 1915 Treaty of London promised, Trentino, Istria and part of Dalmatia, and claims Fiume as well."
 iro_bookmark_1919_JAP:0 "Hara Takashi, the first head of government without a noble title, has led the cabinet since September 1918, after the rice riots of the summer. Japanese troops have occupied eastern Siberia since August. In Paris, Japan wants to keep the German rights in Shandong it seized in 1914."
 iro_bookmark_1919_GER:0 "Since the abdication of Wilhelm II, Friedrich Ebert governs at the head of the Council of the People's Deputies, which the Independents of the USPD left on 29 December. The Communist Party of Germany is holding its founding congress in Berlin, and the National Assembly is to be elected on 19 January. The Allied blockade goes on."
 iro_bookmark_1919_SOV:0 "Lenin's Council of People's Commissars governs from Moscow and annulled the Treaty of Brest-Litovsk on 13 November 1918. Trotsky's Red Army faces Admiral Kolchak, proclaimed Supreme Ruler at Omsk on 18 November, and Denikin in the South, while Allied troops hold Arkhangelsk and Murmansk."
